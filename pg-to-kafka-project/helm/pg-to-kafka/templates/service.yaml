apiVersion: v1
kind: Service
metadata:
  name: {{ include "pg-to-kafka.fullname" . }}
  labels: {{- include "pg-to-kafka.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: {{ include "pg-to-kafka.name" . }}
